# Grafana — mavjud cam.fermi.uz ichida /grafana/ yo'lida (subdomen o'rniga).
#
# Bu location bloki cam.fermi.uz ning 443 server blokiga qo'shiladi:
#   /etc/nginx/sites-available/cam.fermi.uz.conf ichida, `location / {` dan OLDIN:
#       include /opt/camera/deploy/monitoring/nginx/grafana-subpath.conf;
#   sudo nginx -t && sudo systemctl reload nginx
# DIQQAT: deploy/nginx_sync.py cam.fermi.uz faylini to'liq almashtirmaydi,
# shuning uchun qo'shilgan include saqlanib qoladi.
# deploy/monitoring/.env:
#   GRAFANA_ROOT_URL=https://cam.fermi.uz/grafana/
#   GRAFANA_SERVE_FROM_SUB_PATH=true
#   GRAFANA_COOKIE_SECURE=true
# so'ng: sudo bash /opt/camera/deploy/monitoring/up.sh
#
# $connection_upgrade map'i cam-fermi-api.conf da e'lon qilingan (http darajasida).

# ^~ — statik fayllar (.js/.css) cam.fermi.uz dagi regex location'ga tushmasin.
location ^~ /grafana/ {
    # Ikkinchi parol qatlami (ixtiyoriy):
    # auth_basic "Situatsion Markaz monitoring";
    # auth_basic_user_file /etc/nginx/.htpasswd-grafana;

    proxy_pass http://127.0.0.1:13000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
}
