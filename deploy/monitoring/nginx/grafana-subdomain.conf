# Grafana — alohida subdomen (tavsiya etiladi): https://monitor.cam.fermi.uz
#
# O'rnatish (bir marta, root):
#   1) DNS: A yozuv `monitor.cam` -> server IP
#   2) sudo cp /opt/camera/deploy/monitoring/nginx/grafana-subdomain.conf \
#          /etc/nginx/sites-available/monitor.cam.fermi.uz.conf
#      sudo ln -s /etc/nginx/sites-available/monitor.cam.fermi.uz.conf /etc/nginx/sites-enabled/
#   3) sudo certbot --nginx -d monitor.cam.fermi.uz   (sertifikat yo'llari shu yerda yangilanadi)
#   4) Ikkinchi parol qatlami (ixtiyoriy, tavsiya): sudo htpasswd -c /etc/nginx/.htpasswd-grafana <login>
#      va pastdagi auth_basic qatorlarini yoqing.
#   5) sudo nginx -t && sudo systemctl reload nginx
# deploy/monitoring/.env: GRAFANA_ROOT_URL=https://monitor.cam.fermi.uz/ , GRAFANA_COOKIE_SECURE=true
#
# Grafana o'zi login so'raydi (GRAFANA_ADMIN_*; ro'yxatdan o'tish va anonim kirish o'chiq).

map $http_upgrade $grafana_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name monitor.cam.fermi.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name monitor.cam.fermi.uz;

    ssl_certificate /etc/letsencrypt/live/monitor.cam.fermi.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitor.cam.fermi.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /opt/camera/deploy/nginx/cam-security-headers.conf;

    # Faqat institut tarmog'idan ruxsat berish (ixtiyoriy):
    # allow 192.168.0.0/16;
    # allow <ofis-tashqi-IP>;
    # deny all;

    # auth_basic "Situatsion Markaz monitoring";
    # auth_basic_user_file /etc/nginx/.htpasswd-grafana;

    location / {
        proxy_pass http://127.0.0.1:13000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Grafana Live (WebSocket).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $grafana_connection_upgrade;
        proxy_read_timeout 300s;
    }

    # Prometheus / Alertmanager tashqariga ochilmaydi — faqat SSH tunnel:
    #   ssh -L 19090:127.0.0.1:19090 -L 19093:127.0.0.1:19093 <user>@<server>
}
