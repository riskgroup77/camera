# HLS (MediaMTX shardlari). cam.fermi.uz va stream.cam.fermi.uz HTTPS
# server { } bloklari ichiga qo'shiladi:
#
#     include /opt/camera/deploy/nginx/cam-fermi-stream-locations.conf;
#
# Talablar: http { } ichida /etc/nginx/conf.d/camera-stream-shard-map.conf
# ($legacy_camera_shard) va nginx'ning secure_link moduli.
#
# Havolalar imzolanadi (camera-api/app/services/stream_links.py):
#
#     /sN/<md5>,<muddat>/cam-<uuid>/...
#
# Pleylist ichidagi segmentlar nisbiy, shuning uchun ular imzoli prefiksni
# o'zi oladi. Sir repoda EMAS — /etc/nginx/snippets/cam-stream-secret.conf
# da (deploy/enable-stream-auth.sh yozadi). U fayl yo'q bo'lsa eski holat
# saqlanadi: imzosiz havolalar ham ochiladi, imzolilari esa 403.

set $cam_stream_secret "";
set $cam_stream_allow_unsigned 1;
include /etc/nginx/snippets/cam-stream-secret*.conf;

# Shardsiz eski havolalar -> to'g'ri shard (imzo talabi o'sha yerda).
location ~ ^/cam-[0-9a-f-]+ {
    return 301 https://$host/s$legacy_camera_shard$request_uri;
}

# ── Imzolangan havolalar ───────────────────────────────────────────────────
location ~ "^/s0/(?<cam_link_hash>[A-Za-z0-9_-]{22}),(?<cam_link_expires>[0-9]{1,12})/(?<cam_link_camera>cam-[0-9a-f-]+)(?<cam_link_tail>/.*)$" {
    if ($cam_stream_secret = "") { return 403; }
    secure_link $cam_link_hash,$cam_link_expires;
    secure_link_md5 "$cam_link_expires/s0/$cam_link_camera $cam_stream_secret";
    if ($secure_link = "") { return 403; }
    if ($secure_link = "0") { return 410; }
    proxy_pass http://127.0.0.1:8888/$cam_link_camera$cam_link_tail$is_args$args;
    include /opt/camera/deploy/nginx/cam-stream-proxy-params.conf;
}

location ~ "^/s1/(?<cam_link_hash>[A-Za-z0-9_-]{22}),(?<cam_link_expires>[0-9]{1,12})/(?<cam_link_camera>cam-[0-9a-f-]+)(?<cam_link_tail>/.*)$" {
    if ($cam_stream_secret = "") { return 403; }
    secure_link $cam_link_hash,$cam_link_expires;
    secure_link_md5 "$cam_link_expires/s1/$cam_link_camera $cam_stream_secret";
    if ($secure_link = "") { return 403; }
    if ($secure_link = "0") { return 410; }
    proxy_pass http://127.0.0.1:8889/$cam_link_camera$cam_link_tail$is_args$args;
    include /opt/camera/deploy/nginx/cam-stream-proxy-params.conf;
}

location ~ "^/s2/(?<cam_link_hash>[A-Za-z0-9_-]{22}),(?<cam_link_expires>[0-9]{1,12})/(?<cam_link_camera>cam-[0-9a-f-]+)(?<cam_link_tail>/.*)$" {
    if ($cam_stream_secret = "") { return 403; }
    secure_link $cam_link_hash,$cam_link_expires;
    secure_link_md5 "$cam_link_expires/s2/$cam_link_camera $cam_stream_secret";
    if ($secure_link = "") { return 403; }
    if ($secure_link = "0") { return 410; }
    proxy_pass http://127.0.0.1:8890/$cam_link_camera$cam_link_tail$is_args$args;
    include /opt/camera/deploy/nginx/cam-stream-proxy-params.conf;
}

# ── Imzosiz havolalar — faqat o'tish davrida ──────────────────────────────
location /s0/ {
    if ($cam_stream_allow_unsigned != 1) { return 403; }
    proxy_pass http://127.0.0.1:8888/;
    include /opt/camera/deploy/nginx/cam-stream-proxy-params.conf;
}

location /s1/ {
    if ($cam_stream_allow_unsigned != 1) { return 403; }
    proxy_pass http://127.0.0.1:8889/;
    include /opt/camera/deploy/nginx/cam-stream-proxy-params.conf;
}

location /s2/ {
    if ($cam_stream_allow_unsigned != 1) { return 403; }
    proxy_pass http://127.0.0.1:8890/;
    include /opt/camera/deploy/nginx/cam-stream-proxy-params.conf;
}

# Frontend/HLS javoblarini siqish (JS, CSS, m3u8) — izohi faylning ichida.
include /opt/camera/deploy/nginx/cam-frontend-gzip.conf;
