map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name camapi.fermi.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen 192.168.0.101:443 ssl;
    listen [::]:443 ssl;
    server_name camapi.fermi.uz;

    ssl_certificate /etc/letsencrypt/live/cam.fermi.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cam.fermi.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 50M;

    # API xaritasi (/docs, /openapi.json) tashqariga ochilmaydi — ilova
    # o'zi ham o'chiradi (API_DOCS_ENABLED), bu ikkinchi qatlam.
    location ~ ^/(docs|redoc|openapi\.json)$ {
        return 404;
    }

    # Prometheus ko'rsatkichlari faqat ichki tarmoqda: Prometheus API'ni
    # Docker tarmog'i orqali o'qiydi (deploy/monitoring/). Tashqaridan hech
    # qachon — ilova ham tashqi IP'ni rad etadi, bu ikkinchi qatlam.
    location ^~ /metrics {
        deny all;
    }

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        # CORS: upstream header yashiriladi, nginx bitta header qo'shadi (502 da ham ishlaydi)
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        add_header Access-Control-Allow-Origin "https://cam.fermi.uz" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        # X-Report-Token — hisobotlar paroli (app/routers/report_lock.py); ro'yxatda
        # bo'lmasa brauzer preflight'dan o'tmaydi va hisobot "Serverga ulanib bo'lmadi" beradi.
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Report-Token" always;
        include /opt/camera/deploy/nginx/cam-security-headers.conf;
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }
}
