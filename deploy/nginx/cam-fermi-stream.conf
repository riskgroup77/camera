server {
    listen 80;
    listen [::]:80;
    server_name stream.cam.fermi.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen 192.168.0.101:443 ssl;
    listen [::]:443 ssl;
    server_name stream.cam.fermi.uz;

    ssl_certificate /etc/letsencrypt/live/storage.camapi.fermi.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/storage.camapi.fermi.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /opt/camera/deploy/nginx/cam-security-headers.conf;

    # Shardlar (/s0 /s1 /s2), imzolangan havolalar — cam.fermi.uz bilan umumiy.
    include /opt/camera/deploy/nginx/cam-fermi-stream-locations.conf;

    # Unknown paths — do not silently proxy to shard 0 (misleading "no stream" errors)
    location / {
        return 404;
    }
}
