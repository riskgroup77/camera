# Brauzer xavfsizlik sarlavhalari.
#
# Diqqat: ichki blokda (location) bitta bo'lsa ham `add_header` yozilsa,
# tashqi blokdagi add_header'larning HAMMASI bekor bo'ladi. Shuning uchun
# o'z add_header'i bor har bir location ham shu faylni qo'shadi.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Kamera — ro'yxatdan o'tish sahifasidagi yuz suratga olish uchun.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Strict-Transport-Security "max-age=15552000" always;
