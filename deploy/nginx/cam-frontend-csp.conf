# cam.fermi.uz uchun Content-Security-Policy.
#
# Hozircha faqat kuzatish (Report-Only): buzilishlar brauzer konsolida
# ko'rinadi, hech narsa bloklanmaydi. Barcha sahifalarda konsol toza
# bo'lsa — sarlavha nomi `Content-Security-Policy` ga almashtiriladi.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://camapi.fermi.uz https://storage.camapi.fermi.uz; media-src 'self' blob:; connect-src 'self' https://camapi.fermi.uz wss://camapi.fermi.uz https://storage.camapi.fermi.uz https://stream.cam.fermi.uz; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
