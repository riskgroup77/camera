server {
    listen 80;
    listen [::]:80;
    server_name storage.camapi.fermi.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # 192.168.0.101 ham kerak: serverdagi boshqa saytlar shu manzilni alohida
    # tinglaydi, va unda bu domen bo'lmasa LAN'dan kirganga boshqa saytning
    # sertifikati chiqadi (2026-09-18 da shunday bo'ldi).
    listen 443 ssl;
    listen 192.168.0.101:443 ssl;
    listen [::]:443 ssl;
    server_name storage.camapi.fermi.uz;

    ssl_certificate /etc/letsencrypt/live/storage.camapi.fermi.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/storage.camapi.fermi.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 100M;
    ignore_invalid_headers off;
    proxy_buffering off;

    location / {
        proxy_pass http://127.0.0.1:9100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
