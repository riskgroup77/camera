# Frontend fayllarini siqish. cam.fermi.uz server { } bloki ichiga:
#
#     include /opt/camera/deploy/nginx/cam-frontend-gzip.conf;
#
# Sabab (2026-09-20 o'lchovi): nginx.conf da `gzip on` bor, lekin
# gzip_types yozilmagan — standart bo'yicha faqat text/html siqiladi.
# Shu sababli JS/CSS siqilmasdan ketardi: index JS 256 KB (siqilganda ~80 KB),
# hls 510 KB, pdf 427 KB. Sekin internetda sahifa shuncha uzoq ochilardi.
#
# gzip_types HTTP javob turi bo'yicha ishlaydi, shuning uchun bu yerda
# takrorlash /etc/nginx/nginx.conf ga tegmasdan faqat shu saytga ta'sir qiladi.

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    application/javascript
    text/javascript
    application/json
    application/manifest+json
    text/css
    text/plain
    image/svg+xml
    application/wasm
    application/vnd.apple.mpegurl;
